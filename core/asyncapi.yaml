# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        - $ref: '#/components/schemas/AgentPollState'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        - $ref: '#/components/schemas/AgentTokenUsage'
        - $ref: '#/components/schemas/AgentPidUpdate'
        # Remote-answer plane (v4 T2 — managed sessions)
        - $ref: '#/components/schemas/AgentManagedUpdate'
        # Progression (v1 mechanic #3)
        - $ref: '#/components/schemas/ProgressionUpdate'
        # Dispatch (v1 mechanic #6b — call a coworker)
        - $ref: '#/components/schemas/DispatchUpdate'
        # Streaming telemetry (KICKOFF-v2.0 Phase 2 — live output tail)
        - $ref: '#/components/schemas/OutputChunk'
        # Employees (v2 mechanic G1 — colony-sim layer, GAME-DESIGN.md §4)
        - $ref: '#/components/schemas/EmployeeSnapshot'
        - $ref: '#/components/schemas/EmployeeHired'
        - $ref: '#/components/schemas/EmployeeQuit'
        # Economy + Building (v2 mechanic G2 — GAME-DESIGN.md §3/§5)
        - $ref: '#/components/schemas/EconomyUpdate'
        - $ref: '#/components/schemas/OfficeExpanded'
        - $ref: '#/components/schemas/OfficeLayoutUpdated'
        # Command + Automation (v2 mechanic G3 — GAME-DESIGN.md §7)
        - $ref: '#/components/schemas/ChainRunUpdate'
        - $ref: '#/components/schemas/StandingOrderUpdate'
        - $ref: '#/components/schemas/BudgetUpdate'
        - $ref: '#/components/schemas/AutomationStopped'
        # Living world (v2 mechanic G5 — GAME-DESIGN.md §6.3)
        - $ref: '#/components/schemas/WorldEventFired'
        # Living Studio substrate (v3 WS-C — KICKOFF-v3.1 §3)
        - $ref: '#/components/schemas/ContractsUpdated'
        - $ref: '#/components/schemas/DossierUpdated'
        - $ref: '#/components/schemas/MatchDayEvent'
        - $ref: '#/components/schemas/ReworkBinUpdated'
        - $ref: '#/components/schemas/RivalryUpdated'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/DispatchRequest'
        - $ref: '#/components/schemas/TailSubscribe'
        - $ref: '#/components/schemas/TailUnsubscribe'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/RequestDiagnostics'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        machine:
          type: string
          description: TEXT label of the machine this agent runs on (e.g. "MACBOOK", "NEXUS").
        provider:
          type: string
          description: >-
            Coworker provider id ('codex', 'gemini', …) when the agent is NOT a
            Claude Code session. Rendered as a distinct silhouette + TEXT label
            (e.g. "[CODEX]") — never color-only. Absent for Claude sessions.
        sessionId:
          type: string
          description: >-
            The real session/transcript id (server AgentState.sessionId).
            Carried through so the detail drawer (mechanic #6b) can target a
            FOCUS dispatch and show a copy-able identity line; never rendered
            as a chip/badge on its own.
        cwd:
          type: string
          description: >-
            Real project directory (server AgentState.projectDir) — the
            detail drawer's "project dir" field. Distinct from folderName,
            which is only the short label used for multi-root workspaces.
        pid:
          type: integer
          description: >-
            OS process id of the claude session, captured via the command-hook
            forwarder's X-Pid header (server AgentState.pid). Drives the
            detail drawer's FOCUS button (bin/dispatch-runner.mjs `focus`
            action fronts a terminal by pid). Absent until the first hook
            event with pid telemetry arrives for this session — FOCUS stays
            honestly disabled ("NO PID") until then.

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean
        machines:
          type: object
          description: Map of agent ID (string) to machine TEXT label (e.g. "MACBOOK", "NEXUS").
          additionalProperties:
            type: string
        providers:
          type: object
          description: >-
            Map of agent ID (string) to coworker provider id ('codex',
            'gemini', …). Claude sessions are omitted (house default).
          additionalProperties:
            type: string
        sessionIds:
          type: object
          description: Map of agent ID (string) to real session/transcript id.
          additionalProperties:
            type: string
        cwds:
          type: object
          description: Map of agent ID (string) to real project directory.
          additionalProperties:
            type: string
        pids:
          type: object
          description: Map of agent ID (string) to OS process id (see AgentCreated.pid).
          additionalProperties:
            type: integer
        managed:
          type: object
          description: >-
            Map of agent ID (string) to managed flag (T2 remote-answer plane).
            True ONLY for sessions launched via War Room that a runner is
            currently advertising as alive in its own tmux — the client's
            ONLY license to render the ANSWER verb. Absent/false agents keep
            the honest DESK-only explainer.
          additionalProperties:
            type: boolean

    AgentManagedUpdate:
      description: >-
        Live managed-flag transition for one agent (T2 remote-answer plane,
        REMOTE-ANSWER-DESIGN.md). Emitted when a runner's poll advertisement
        starts (managed true) or stops (managed false — session died or the
        runner went silent) covering the agent. The flag is derived
        server-side from the runner's manifest+alive advertisement, never
        client-asserted.
      type: object
      additionalProperties: false
      required: [type, id, managed]
      properties:
        type:
          const: agentManagedUpdate
        id:
          type: integer
        managed:
          type: boolean

    AgentPidUpdate:
      description: >-
        Late-arriving pid telemetry for an already-known agent (e.g. a
        locally-discovered session whose hook events start including X-Pid
        only after the forwarder is installed/refreshed). AgentCreated/
        ExistingAgents cover the pid-at-creation case; this covers pid
        arriving afterward so the FOCUS button lights up live without a
        page refresh.
      type: object
      additionalProperties: false
      required: [type, id, pid]
      properties:
        type:
          const: agentPidUpdate
        id:
          type: integer
        pid:
          type: integer

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    AgentPollState:
      description: >-
        Session state reported by the per-machine needs-input poller
        (`claude agents --json`, research preview surface). Absent `state`
        means the poll state was cleared (client falls back to local
        JSONL/hook signals). `blocked` renders as the loudest ⚠ NEEDS INPUT
        badge — SHAPE + TEXT label, color as reinforcement only (colorblind
        rule).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentPollState
        id:
          type: integer
        state:
          $ref: '#/components/schemas/AgentPollStateValue'
        waitingFor:
          type: string
          description: >-
            What the blocked agent is waiting on (verbatim from the CLI).
            Rendered as TEXT detail under the NEEDS INPUT badge.
        ageMs:
          type: integer
          description: >-
            Milliseconds since the state TRANSITION, computed on the server's
            clock so client clock skew cancels out (client derives
            `since = Date.now() - ageMs`). Drives the v1 crisis layer's
            smoke → fire → alarm aging. Absent on clear messages.
        stale:
          type: boolean
          description: >-
            Set on CLEAR messages caused by poller silence (TTL sweep) rather
            than an observed state change — the session may still be blocked.
            The webview drops the badge without the "resolved" celebration.

    AgentPollStateValue:
      description: Agent session state from `claude agents --json`.
      type: string
      enum: [working, blocked, done, failed, stopped]

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentTokenUsage:
      description: Cumulative token usage for the agent's session.
      type: object
      additionalProperties: false
      required: [type, id, inputTokens, outputTokens]
      properties:
        type:
          const: agentTokenUsage
        id:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer

    ProgressionUpdate:
      description: >-
        Progression snapshot (v1 mechanic #3): server-side XP/level/streak/
        unlock state, one per user (not per agent). Broadcast whenever it
        changes and sent again to every client on WebSocket connect. XP comes
        ONLY from real, observed events — completed turns, observed crisis
        resolutions (never stale/TTL poller clears), and shift-report grades
        — never from token volume (hard guardrail: no dark patterns on real
        money; nothing here ever rewards spending more).
      type: object
      additionalProperties: false
      required:
        [
          type,
          xp,
          level,
          xpIntoLevel,
          xpForNextLevel,
          streakCurrent,
          streakLongest,
          unlocks,
          ledger,
        ]
      properties:
        type:
          const: progressionUpdate
        xp:
          type: integer
        level:
          type: integer
        xpIntoLevel:
          type: integer
          description: XP earned since reaching the current level.
        xpForNextLevel:
          type: integer
          description: Total XP required to go from the current level to the next.
        streakCurrent:
          type: integer
          description: >-
            Consecutive local-calendar days with at least one observed real
            completed turn — the M5 soak made literal.
        streakLongest:
          type: integer
        unlocks:
          type: object
          description: >-
            DATA ONLY for now — permanent achievement flags (never revert
            once true). Mechanic #5 (expression pass) will consume these to
            render decor in a later wave; nothing renders from them yet.
          additionalProperties:
            type: boolean
        ledger:
          type: array
          description: >-
            XP receipt lines (v3 REP receipts — capped ring buffer, 200
            entries, currency always 'xp'): every XP movement carries a
            mandatory cause naming the observed source event.
          items:
            $ref: '#/components/schemas/EconomyLedgerEntry'

    DispatchUpdate:
      description: >-
        Dispatch queue lifecycle (v1 mechanic #6b — "call a coworker"):
        broadcast whenever a dispatch or focus request changes state, and
        replayed for non-terminal entries to every client on WebSocket
        connect. Lifecycle: ringing -> answered -> exited, or ringing ->
        denied / expired. `promptPreview` is a ~120-char truncation only —
        the full prompt NEVER travels over this broadcast plane (it is
        carried solely on the Bearer-authed runner poll). Rendered as a
        distinct glyph + WORD per status (colorblind rule): (ringing) ->
        (answered) / (denied) / (expired) / (exited).
      type: object
      additionalProperties: false
      required: [type, id, action, status, machine]
      properties:
        type:
          const: dispatchUpdate
        id:
          type: string
          description: Dispatch request UUID.
        action:
          $ref: '#/components/schemas/DispatchActionValue'
        status:
          $ref: '#/components/schemas/DispatchStatusValue'
        machine:
          type: string
          description: Target machine TEXT label the request was dispatched to.
        provider:
          type: string
          description: Coworker provider id ('claude', 'codex', 'gemini') — dispatch action only.
        promptPreview:
          type: string
          description: >-
            Truncated (~120 char) preview of the prompt — dispatch action
            only. The full prompt is never broadcast.
        reason:
          type: string
          description: Deny/failure reason (data, not an error) — e.g. "path-not-allowlisted".
        pid:
          type: integer
          description: Process id of the spawned CLI (dispatch) or focused session (focus), once known.
        exitCode:
          type: integer
          description: Exit code of the spawned process — exited status only.
        resultTail:
          type: string
          description: >-
            Capped (~8KB) tail of the run's log — dispatch action, exited
            status only. The only place a run's actual output reaches the
            dashboard; same trust level as promptPreview (never the full log).
        timeoutSec:
          type: integer
          description: >-
            Verbatim echo of the request's timeoutSec, present only when the
            request carried one — lets a capped status render "(Ns)" without
            a second round trip.
        requestId:
          type: string
          maxLength: 64
          description: >-
            Verbatim echo of DispatchRequest.requestId, present only when
            the originating client supplied one — the requesting client's
            send-failure detector matches on this exactly.
        updatedAt:
          type: integer
          description: >-
            Server epoch-ms timestamp of this lifecycle revision. Present on
            live broadcasts and /api/dispatch/recent snapshots so clients can
            reject a delayed HTTP row after a newer WebSocket transition.

    DispatchActionValue:
      description: >-
        Dispatch queue entry kind. `session` (T2/T4, REMOTE-ANSWER-DESIGN.md)
        launches an INTERACTIVE provider CLI inside a runner-owned tmux
        session — gated runner-side on its own deny-by-default
        `"sessions": true` allowlist capability, same decision plane as
        `dispatch`.
      type: string
      enum: [dispatch, focus, session]

    DispatchStatusValue:
      description: >-
        Dispatch queue lifecycle status. `ringing` = queued, awaiting a
        runner's decision. `answered` = a runner accepted (dispatch: CLI
        run in progress; focus: terminal fronted). `denied` = a runner
        (or the server, for an unknown/expired id) refused — a decision,
        never an HTTP error. `expired` = no runner answered within the
        TTL. `exited` = the spawned dispatch process ended on its own
        (dispatch only). `killed` = the dispatch was explicitly ended via
        the worker session kill mechanic (KICKOFF v1.1 item 3) — a DISTINCT
        terminal status, never conflated with a natural `exited`. `capped`
        = the dispatch hit its optional timeoutSec and was ended by the
        runner's own timer (T5 fleet controls) — a DISTINCT terminal
        status, never conflated with `killed` (human-initiated) or a
        natural `exited`. `queued-budget` = the dispatch was accepted by
        the server but HELD, never sent to a runner, because today's real
        fleet token spend has crossed the configured daily ceiling (T5
        fleet controls) — non-terminal, releases to `ringing` on an
        explicit override or an automatic local-date rollover.
      type: string
      enum: [ringing, answered, denied, expired, exited, killed, capped, queued-budget]

    # ── Streaming telemetry (KICKOFF-v2.0 Phase 2 — live output tail) ──

    OutputChunk:
      description: >-
        One live output chunk from a running agent session or dispatch run
        (KICKOFF-v2.0 Phase 2; DISPATCH-6B-DESIGN amendment #2). TELEMETRY
        ONLY — streaming never carries commands and never changes
        runner-decides containment. Delivered ONLY to sockets that sent a
        matching tailSubscribe (never broadcast to every client), with the
        server-side ring buffer replayed on subscribe. Chunks are ephemeral
        (in-memory ring, evicted on terminal status, never persisted — the
        PidKillRecord precedent).
      type: object
      additionalProperties: false
      required: [type, source, id, seq, stream, chunk, truncated]
      properties:
        type:
          const: outputChunk
        source:
          $ref: '#/components/schemas/OutputSourceValue'
        id:
          type: string
          description: >-
            Stream owner id within `source`: the dispatch queue UUID
            (source "dispatch") or the webview-facing numeric agent id,
            stringified (source "agent" — the same id agentCreated/
            agentStatus carry, so no session-id lookup is needed).
        seq:
          type: integer
          description: >-
            Monotonically increasing per (source, id, stream) — lets a
            client detect replay overlap after a reconnect and order chunks
            without trusting arrival order.
        stream:
          $ref: '#/components/schemas/OutputStreamValue'
        chunk:
          type: string
        truncated:
          type: boolean
          description: >-
            True on the first replayed chunk of a stream whose older history
            was evicted by the ring buffer's retention limits (per-stream
            byte budget or chunk-count cap) — a late subscriber knows it is
            seeing a tail, not the full output. Marks REPLAY eviction only:
            chunks a runner dropped in transit (dead/hung server, backlog
            shed) are not signaled here — the durable record stays the
            per-run log and resultTail.

    OutputSourceValue:
      description: Which plane the output stream belongs to.
      type: string
      enum: [agent, dispatch]

    OutputStreamValue:
      description: >-
        Which output stream of the owner the chunk came from. `transcript`
        is the local-JSONL tail (assistant text/tool lines); stdout/stderr
        are dispatch-run pipes forwarded by the runner.
      type: string
      enum: [stdout, stderr, transcript]

    EmployeeScores:
      description: >-
        Derived traits (GAME-DESIGN §4.3), 0-100 + trainingBonus on top —
        never player-assigned. Stay at neutral defaults below MIN_SAMPLES.
      type: object
      additionalProperties: false
      required: [speed, accuracy, nightOwl, tokenEfficiency]
      properties:
        speed:
          type: number
        accuracy:
          type: number
        nightOwl:
          type: number
        tokenEfficiency:
          type: number
          description: Lower OUTPUT token spend scores HIGHER — never a reward for volume.

    EmployeeTrainingBonus:
      type: object
      additionalProperties: false
      required: [speed, accuracy, nightOwl, tokenEfficiency]
      properties:
        speed:
          type: number
        accuracy:
          type: number
        nightOwl:
          type: number
        tokenEfficiency:
          type: number

    EmployeeProviderValue:
      type: string
      enum: [claude, codex]

    EmployeeStatusValue:
      type: string
      enum: [candidate, active, on_break, training, quit, fired, retired]

    EmployeeRankValue:
      type: string
      enum: [Junior, Senior, Lead, Principal]

    EmployeeSnapshot:
      description: >-
        Full employee record snapshot (v2 mechanic G1, GAME-DESIGN §4),
        broadcast after every mutation (turn recorded, crisis resolved,
        verb applied) and replayed for the whole roster on WebSocket
        connect. Mood-only — the three per-employee needs meters are CUT
        (interrogation delta #2). Internal-only bookkeeping fields
        (last-seen token counts, decay timestamps) never leave the server.
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - machine
        - projectDir
        - projectLabel
        - name
        - spriteIndex
        - defaultProvider
        - status
        - rank
        - xp
        - mood
        - moodBoost
        - scores
        - trainingBonus
        - sampleCount
        - createdAt
        - lastActiveAt
        - lowMoodStreakDays
      properties:
        type:
          const: employeeSnapshot
        id:
          type: string
        machine:
          type: string
        projectDir:
          type: string
        projectLabel:
          type: string
        name:
          type: string
        spriteIndex:
          type: integer
          description: >-
            Raw deterministic hash of id — the webview mods by the real
            getLoadedCharacterCount(), never a server-side mod.
        defaultProvider:
          $ref: '#/components/schemas/EmployeeProviderValue'
        defaultModel:
          type: string
        status:
          $ref: '#/components/schemas/EmployeeStatusValue'
        rank:
          $ref: '#/components/schemas/EmployeeRankValue'
        xp:
          type: integer
        mood:
          type: number
          description: Stored base value (needs cut) — effective mood on read is mood+moodBoost.
        moodBoost:
          type: number
          description: Transient event term, clamped ±20, halves each local day.
        scores:
          $ref: '#/components/schemas/EmployeeScores'
        trainingBonus:
          $ref: '#/components/schemas/EmployeeTrainingBonus'
        sampleCount:
          type: integer
          description: >-
            rolling.recentTurns.length — the MIN_SAMPLES=5 gate clients need
            to know whether `scores` is a real read or still neutral
            defaults (ROOKIE badge). The raw turn ring buffer itself never
            leaves the server.
        assignedRoomId:
          type: string
        createdAt:
          type: integer
        lastActiveAt:
          type: integer
        lowMoodStreakDays:
          type: integer
        breakUntil:
          type: integer

    EmployeeHired:
      description: >-
        A brand-new employee identity was observed for the first time
        (first real telemetry for a (machine, project) pair, or a fresh
        `#n` record allocated after a fire) — the roster-arrival signal,
        distinct from EmployeeSnapshot's routine per-mutation broadcast.
      type: object
      additionalProperties: false
      required: [type, id, name, spriteIndex]
      properties:
        type:
          const: employeeHired
        id:
          type: string
        name:
          type: string
        spriteIndex:
          type: integer

    EmployeeQuit:
      description: >-
        An employee's status transitioned to 'quit' (mood-driven, not
        fired — GAME-DESIGN §4.5). Distinct from the routine
        EmployeeSnapshot broadcast so the webview/Bark digest (G4) can key
        a specific quit celebration/notification off it without diffing
        status transitions client-side.
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type:
          const: employeeQuit
        id:
          type: string
        name:
          type: string

    EconomyCurrencyValue:
      type: string
      enum: [cash, reputation, xp]

    EconomyCause:
      description: >-
        Receipt for one economy movement (v3 REP receipts, KICKOFF-v3.1 §3
        WS-C item 2): a human-readable label plus references to the REAL
        observed events the movement derives from — the one-tap-real hard
        rule applied to money/XP. Ledger entries persisted before receipts
        existed are migrated on load with the sentinel label UNKNOWN-LEGACY
        and empty refs (honestly unknown, never guessed).
      type: object
      additionalProperties: false
      required: [label, sourceEventRefs]
      properties:
        label:
          type: string
          description: Short machine-greppable movement label, e.g. turn-completed.
        sourceEventRefs:
          type: array
          description: >-
            References to the observed source events (e.g. dispatch:<id>,
            shift-day:<date>, crisis:agent:<id>@<since>, player-action:<verb>).
            Empty ONLY on migrated pre-receipt entries (UNKNOWN-LEGACY).
          items:
            type: string

    EconomyLedgerEntry:
      description: >-
        One Cash/Reputation/XP ledger line (capped ring buffer, 200 entries).
        Every line carries a mandatory cause receipt — no mutation path can
        omit it (enforced at the type level server-side).
      type: object
      additionalProperties: false
      required: [ts, delta, currency, reason, cause]
      properties:
        ts:
          type: integer
        delta:
          type: number
        currency:
          $ref: '#/components/schemas/EconomyCurrencyValue'
        reason:
          type: string
          description: >-
            The anti-dark-pattern grep-test surface — every award traces to
            an observed real event, never a bare timer or token volume.
            Always equals cause.label (kept as its own field for v2 clients).
        cause:
          $ref: '#/components/schemas/EconomyCause'

    EconomyUpdate:
      description: >-
        Economy snapshot (v2 mechanic G2, GAME-DESIGN §3): dual currency —
        Cash (liquid, spendable) and Reputation (permanent, slow, never
        spent) — plus office-wide grime and the studio vacation-mode flag.
        Broadcast whenever it changes and sent again to every client on
        WebSocket connect (after the offline-progress Reputation-decay
        catch-up runs). Cash/Reputation come ONLY from real, observed
        events — never token volume.
      type: object
      additionalProperties: false
      required: [type, cash, reputation, grime, vacationMode, bayCount, ledger]
      properties:
        type:
          const: economyUpdate
        cash:
          type: integer
        reputation:
          type: integer
        grime:
          type: number
          description: Office-wide 0-100, cosmetic + morale-decay-rate multiplier when >70.
        vacationMode:
          type: boolean
        bayCount:
          type: integer
          description: Office-expansion bays purchased so far (GAME-DESIGN §5.2).
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/EconomyLedgerEntry'

    OfficeExpanded:
      description: >-
        A bay (4-col floor expansion, GAME-DESIGN §5.2) was purchased —
        broadcast by POST /api/building/expand on success. Carries the new
        full layout so every connected screen picks up the extra floor
        (and its doorway) without a re-fetch.
      type: object
      additionalProperties: false
      required: [type, layout, bayCount]
      properties:
        type:
          const: officeExpanded
        layout:
          type: object
          description: Opaque OfficeLayout object — format defined by webview-ui, same as LayoutLoaded.
        bayCount:
          type: integer

    OfficeLayoutUpdated:
      description: >-
        The office layout changed via a room tag, buffed-furniture
        purchase, or sell action (GAME-DESIGN §5.7) — broadcast by
        POST /api/building/{room,furniture,sell} on success. Carries the
        new full layout, same shape as OfficeExpanded/LayoutLoaded.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: officeLayoutUpdated
        layout:
          type: object
          description: Opaque OfficeLayout object — format defined by webview-ui, same as LayoutLoaded.

    # ── Command + Automation (v2 mechanic G3 — GAME-DESIGN.md §7) ───

    ChainStepStatusValue:
      type: string
      enum: [pending, running, exited, denied, expired, killed]

    ChainRunStatusValue:
      type: string
      enum: [running, completed, failed, halted]

    ChainStepRun:
      type: object
      additionalProperties: false
      required: [stepId, status]
      properties:
        stepId:
          type: string
        dispatchId:
          type: string
        status:
          $ref: '#/components/schemas/ChainStepStatusValue'
        exitCode:
          type: integer
        resultTail:
          type: string
        prompt:
          type: string
          description: The step's prompt AFTER {{stepK.result}}/{{stepK.exitCode}} substitution.
        startedAt:
          type: integer
        finishedAt:
          type: integer

    ChainRun:
      type: object
      additionalProperties: false
      required: [id, chainId, status, currentStep, steps, createdAt, updatedAt]
      properties:
        id:
          type: string
        chainId:
          type: string
        status:
          $ref: '#/components/schemas/ChainRunStatusValue'
        currentStep:
          type: integer
          description: 0-based index into steps — the step currently pending/running.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ChainStepRun'
        failReason:
          type: string
        stoppedByKillSwitch:
          type: boolean
        haltReason:
          type: string
          description: >-
            Set when a killed dispatch (KICKOFF v1.1 item 3) halted this
            run — distinct from stoppedByKillSwitch, which is STOP ALL's
            own provenance flag.
        createdAt:
          type: integer
        updatedAt:
          type: integer

    ChainRunUpdate:
      description: >-
        Dispatch chain run lifecycle (v2 mechanic G3, §7.1): broadcast
        whenever a ChainRun mutates (step enqueued, step terminal,
        run completed/failed/halted), and replayed for non-terminal
        (status=running) runs to every client on WebSocket connect —
        same rationale as DispatchUpdate's getActive() replay.
      type: object
      additionalProperties: false
      required: [type, run]
      properties:
        type:
          const: chainRunUpdate
        run:
          $ref: '#/components/schemas/ChainRun'

    StandingOrderScheduleDaily:
      type: object
      additionalProperties: false
      required: [kind, atLocalHour]
      properties:
        kind:
          const: daily
        atLocalHour:
          type: integer

    StandingOrderScheduleInterval:
      type: object
      additionalProperties: false
      required: [kind, everyMs]
      properties:
        kind:
          const: interval
        everyMs:
          type: integer

    StandingOrderScheduleValue:
      oneOf:
        - $ref: '#/components/schemas/StandingOrderScheduleDaily'
        - $ref: '#/components/schemas/StandingOrderScheduleInterval'

    StandingOrder:
      description: >-
        A saved dispatch that fires unattended on a schedule (§7.2).
        needsFirstFireConfirm is an UNCONDITIONAL gate — no perk/purchase
        ever clears it except an explicit human confirm click.
      type: object
      additionalProperties: false
      required: [id, name, schedule, prompt, enabled, needsFirstFireConfirm, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        schedule:
          $ref: '#/components/schemas/StandingOrderScheduleValue'
        machine:
          type: string
        provider:
          type: string
        cwd:
          type: string
        prompt:
          type: string
        model:
          type: string
        effort:
          type: string
        employeeId:
          type: string
        enabled:
          type: boolean
        needsFirstFireConfirm:
          type: boolean
        lastFiredAt:
          type: integer
        lastFiredDate:
          type: string
        lastSkipReason:
          type: string
        stoppedByKillSwitch:
          type: boolean
        createdAt:
          type: integer
        updatedAt:
          type: integer

    StandingOrderUpdate:
      description: >-
        Standing order lifecycle (v2 mechanic G3, §7.2): broadcast on every
        create/confirm/enable/fire/skip mutation, and replayed in full to
        every client on WebSocket connect.
      type: object
      additionalProperties: false
      required: [type, order]
      properties:
        type:
          const: standingOrderUpdate
        order:
          $ref: '#/components/schemas/StandingOrder'

    BudgetClaudeSnapshot:
      type: object
      additionalProperties: false
      required: [fiveHourUsedPct, sevenDayUsedPct, stale, receivedAt]
      properties:
        fiveHourUsedPct:
          type: [number, 'null']
        sevenDayUsedPct:
          type: [number, 'null']
        stale:
          type: boolean
          description: >-
            true whenever no fresh Claude snapshot exists — the fail-safe
            pause condition (BUDGET_STALE_MS).
        receivedAt:
          type: [integer, 'null']
        fiveHourResetsAt:
          type: [integer, 'null']
          description: >-
            Unix ms the 5h window resets, verbatim from the rate-limit
            snapshot's own resets_at (T5 fleet controls, display-only
            scheduling hint) — null/absent means the snapshot itself
            carried none, never a computed guess.
        sevenDayResetsAt:
          type: [integer, 'null']
          description: Unix ms the 7d window resets — same honesty posture as fiveHourResetsAt.

    BudgetCodexSnapshot:
      type: object
      additionalProperties: false
      required: [weeklyCap, weeklyUsed, estimatedPct]
      properties:
        weeklyCap:
          type: [integer, 'null']
        weeklyUsed:
          type: integer
        estimatedPct:
          type: [integer, 'null']
          description: >-
            Always rendered with an "est." prefix client-side — NEVER the
            bare % the Claude meter gets (the word is the honesty signal,
            GAME-DESIGN §7.4).

    BudgetUpdate:
      description: >-
        Budget guardrail snapshot (v2 mechanic G3, §7.4) — the REAL,
        non-fictional Claude rate-limit signal (fail-safe `stale:true` when
        no fresh report exists) plus the manual, honestly `est.`-labeled
        Codex weekly heuristic. Broadcast whenever the underlying snapshot
        changes and sent again to every client on WebSocket connect.
      type: object
      additionalProperties: false
      required: [type, claude, codex]
      properties:
        type:
          const: budgetUpdate
        claude:
          $ref: '#/components/schemas/BudgetClaudeSnapshot'
        codex:
          $ref: '#/components/schemas/BudgetCodexSnapshot'

    AutomationStopped:
      description: >-
        The global STOP ALL kill switch fired (§7.5) — every enabled
        standing order disabled and every running chain run halted, in one
        server transaction. Resuming (POST /api/automation/resume) is a
        separate explicit action, never automatic.
      type: object
      additionalProperties: false
      required: [type, haltedOrderIds, haltedRunIds]
      properties:
        type:
          const: automationStopped
        haltedOrderIds:
          type: array
          items:
            type: string
        haltedRunIds:
          type: array
          items:
            type: string

    WorldEventFired:
      description: >-
        One ambient world event fired (v2 mechanic G5, GAME-DESIGN §6.3) —
        broadcast live from the coarse "live tick" (§2) whenever
        worldEventStore.tick() rolls a hit, in addition to the store's own
        event log (already consumed by GET /api/economy/summary's digest).
        Purely cosmetic flavor for WorldEventBanner.tsx; the ONE currency
        effect any of these events can have (flavor_bonus's capped Cash) is
        carried separately by its own economyUpdate broadcast, never inferred
        from this message. Every fictional world event renders through
        SignalChip with real=false (§6.1) — this message is never used for a
        real/observed fact.
      type: object
      additionalProperties: false
      required: [type, id, glyph, ts, summary]
      properties:
        type:
          const: worldEventFired
        id:
          type: string
          description: One of the 12 WORLD_EVENTS ids (worldEventStore.ts).
        glyph:
          type: string
        ts:
          type: integer
        summary:
          type: string
          description: Short flavor text — the same string digest.ts's narrative reuses.

    # ── Living Studio substrate (v3 WS-C — KICKOFF-v3.1 §3) ────────
    #
    # Shared invariants for every schema in this section:
    #  - REAL-SIGNAL ONLY (hard rule 2): every record derives from observed
    #    events (vault todo lines, chain runs, dispatch exits, agent cwds) —
    #    never a timer, never token volume, never invented.
    #  - ONE-TAP-REAL (hard rule 5): every derived number/state carries a
    #    reference to its source events (`sourceTodo`, `earnedFrom`,
    #    `sourceRef`, `failureRef`, `evidence`) so the UI can decompose it
    #    into verbatim telemetry on tap.
    #  - NO DARK PATTERNS (hard rule 3): contract targets sit BELOW natural
    #    pace, expiry is QUIET (no penalty, no notification, no streak
    #    shame), and the rework bin has a first-class dismiss verb.

    StudioContractSourceTodo:
      description: >-
        The real vault todo line a studio contract was minted from — kept
        VERBATIM (one-tap-real): `text` is the untouched source line, and
        file+line let the UI deep-link the ground truth.
      type: object
      additionalProperties: false
      required: [file, line, text]
      properties:
        file:
          type: string
          description: Absolute path of the todo file the line was read from.
        line:
          type: integer
          description: 1-based line number within `file` at ingest time.
        text:
          type: string
          description: The source line, verbatim — never paraphrased or truncated.

    StudioContractProgressEvent:
      description: >-
        One REAL observed event that moved a contract forward. `sourceRef`
        is the one-tap-real pointer (e.g. "dispatch:<uuid>",
        "chainRun:<id>", "todo:<file>#L<line>") — progress is never a bare
        number without a traceable source.
      type: object
      additionalProperties: false
      required: [ts, sourceRef, summary]
      properties:
        ts:
          type: integer
        sourceRef:
          type: string
          description: Reference to the observed source event (never empty).
        summary:
          type: string
          description: Short human-readable line for the contract's progress feed.

    StudioContractStatusValue:
      description: >-
        Aging-contract lifecycle (KICKOFF-v3.1 return hook). `offered` =
        minted from a real todo, not yet accepted. `expired` is QUIET expiry
        only — no penalty, no notification, no loss-aversion framing; the
        contract simply leaves the wall.
      type: string
      enum: [offered, accepted, progressing, completed, expired]

    StudioContract:
      description: >-
        One aging contract (v3 return hook — KICKOFF-v3.1 §1 "Aging
        contracts"): a real vault todo dressed as a studio contract.
        Progress bars fill ONLY from real outcomes (`progress` events),
        rewards are BONUS-ONLY (missing a contract never costs anything),
        and targets sit below natural pace by design. Distinct from the v2
        G4 Contract (contractStore.ts) — that plane stays untouched.
      type: object
      additionalProperties: false
      required: [id, sourceTodo, status, progress, reward, quietExpiryAt]
      properties:
        id:
          type: string
        sourceTodo:
          $ref: '#/components/schemas/StudioContractSourceTodo'
        status:
          $ref: '#/components/schemas/StudioContractStatusValue'
        progress:
          type: array
          description: Real observed progress events, oldest first. Empty until real outcomes land.
          items:
            $ref: '#/components/schemas/StudioContractProgressEvent'
        reward:
          type: integer
          description: >-
            Bonus-only Cash reward on completion. Never negative; expiry
            never claws anything back (no-dark-pattern rule).
        acceptedAt:
          type: integer
          description: Epoch ms the player accepted — absent while still offered.
        quietExpiryAt:
          type: integer
          description: >-
            Epoch ms the contract quietly leaves the board if not completed.
            Quiet = no penalty, no push, no red banner — it just goes away.
        completedAt:
          type: integer
        expiredAt:
          type: integer

    ContractsUpdated:
      description: >-
        A studio contract was minted or changed state (v3 WS-C) — broadcast
        per mutation, with non-terminal contracts replayed to every client
        on WebSocket connect. Only emitted when the source data plane
        (WAR_ROOM_TODO_DIR) actually exists — the store is feature-flagged
        OFF when there is nothing real to derive from.
      type: object
      additionalProperties: false
      required: [type, contract]
      properties:
        type:
          const: contractsUpdated
        contract:
          $ref: '#/components/schemas/StudioContract'

    DossierTrait:
      description: >-
        One earned dossier trait. `earnedFrom` is REQUIRED and non-empty —
        a trait with no real event references cannot exist (one-tap-real:
        tapping the trait shows exactly which observed events earned it).
      type: object
      additionalProperties: false
      required: [name, earnedFrom, earnedAt]
      properties:
        name:
          type: string
        earnedFrom:
          type: array
          minItems: 1
          description: References to the real observed events that earned this trait.
          items:
            type: string
        earnedAt:
          type: integer

    StaffDossier:
      description: >-
        Persistent staff identity file (v3 WS-C "dossier"). `staffId` is the
        stable (machine, projectDir)-lineage key — the same
        `MACHINE:project-slug[#n]` algorithm employeeId.ts/employeeStore.ts
        already use, so dossier and roster never drift on identity. Traits
        and history are computed from real telemetry only.
      type: object
      additionalProperties: false
      required: [staffId, displayName, traits, history]
      properties:
        staffId:
          type: string
          description: Stable id keyed by machine+projectDir lineage (employeeId.ts algorithm).
        displayName:
          type: string
        traits:
          type: array
          items:
            $ref: '#/components/schemas/DossierTrait'
        history:
          type: string
          description: Short summary of the staff member's real work history.
        portraitRef:
          type: string
          description: >-
            Asset-manifest reference for the generated portrait (WS-B codex
            $imagegen lane) — absent until a portrait asset exists; the UI
            falls back to the sprite, never a broken image.

    DossierUpdated:
      description: >-
        A staff dossier was created or mutated (trait earned, history
        recomputed, portrait attached) — broadcast per mutation, full set
        replayed on WebSocket connect while the source data exists.
      type: object
      additionalProperties: false
      required: [type, dossier]
      properties:
        type:
          const: dossierUpdated
        dossier:
          $ref: '#/components/schemas/StaffDossier'

    MatchDayPhaseValue:
      description: Fixture lifecycle — pre (team sheet), live (commentary), result (card).
      type: string
      enum: [pre, live, result]

    MatchVerdictValue:
      description: >-
        Honest W/D/L mapping from REAL git/test outcomes (KICKOFF-v3.1
        tentpole rule: "W/D/L mapping must stay honest") — never rolled,
        never nudged.
      type: string
      enum: [W, D, L]

    MatchDayAxisStatusValue:
      description: >-
        REAL = the axis value was observed this run. NO_DATA = the signal
        was absent and is rendered as literally "NO DATA" — NEVER guessed,
        NEVER defaulted to a plausible number (hard rule from the Review
        Panel set-piece).
      type: string
      enum: [REAL, NO_DATA]

    MatchDayAxis:
      description: >-
        One result-card axis (tests/build/scope/burn). When `status` is
        REAL, `value` and `sourceRef` are both present (one-tap-real); when
        NO_DATA, neither is — a NO_DATA axis carrying a value is a protocol
        violation.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/MatchDayAxisStatusValue'
        value:
          type: number
          description: The real observed value — present iff status is REAL.
        sourceRef:
          type: string
          description: Reference to the observed source event(s) — present iff status is REAL.

    MatchDayResult:
      description: Result card — every axis is a real read or an explicit NO_DATA.
      type: object
      additionalProperties: false
      required: [verdict, tests, build, scope, burn]
      properties:
        verdict:
          $ref: '#/components/schemas/MatchVerdictValue'
        tests:
          $ref: '#/components/schemas/MatchDayAxis'
        build:
          $ref: '#/components/schemas/MatchDayAxis'
        scope:
          $ref: '#/components/schemas/MatchDayAxis'
        burn:
          $ref: '#/components/schemas/MatchDayAxis'

    MatchDayFeedEvent:
      description: >-
        One live-commentary line synthesized from a REAL tail/git/test line.
        `sourceRef` points at the observed source (e.g.
        "outputChunk:dispatch:<id>#<seq>", "chainStep:<runId>/<stepId>") so
        the verbatim telemetry is one tap away; `commentary` is the diegetic
        costume over it, never a replacement for it.
      type: object
      additionalProperties: false
      required: [ts, kind, sourceRef, commentary]
      properties:
        ts:
          type: integer
        kind:
          type: string
          description: Event class (e.g. "kickoff", "step-exited", "test-fail") — TEXT, shape+label first.
        sourceRef:
          type: string
        commentary:
          type: string

    MatchDayEvent:
      description: >-
        Match Day fixture update (v3 tentpole — chains as fixtures): one
        broadcast per phase transition or appended feed event. `result` is
        present iff phase is "result". Fixtures derive 1:1 from real chain
        runs (`chainRunId`) — no fixture ever exists without a run behind
        it.
      type: object
      additionalProperties: false
      required: [type, fixtureId, chainRunId, phase, events]
      properties:
        type:
          const: matchDayEvent
        fixtureId:
          type: string
        chainRunId:
          type: string
          description: The real ChainRun id this fixture wraps (one-tap-real anchor).
        phase:
          $ref: '#/components/schemas/MatchDayPhaseValue'
        events:
          type: array
          description: Full feed so far, oldest first (idempotent snapshot, not a delta).
          items:
            $ref: '#/components/schemas/MatchDayFeedEvent'
        result:
          $ref: '#/components/schemas/MatchDayResult'

    ReworkBinSourceValue:
      description: Which real failure plane the crate came from.
      type: string
      enum: [dispatch, crisis]

    ReworkFailureRef:
      description: >-
        One-tap-real pointer at the failure: `id` is the source record's id
        (dispatch queue UUID, or the crisis key), `excerpt` is a VERBATIM
        tail excerpt of the failure output (capped server-side; same trust
        level as DispatchUpdate.resultTail — never the full log).
      type: object
      additionalProperties: false
      required: [id, excerpt]
      properties:
        id:
          type: string
        excerpt:
          type: string

    ReworkBinStatusValue:
      description: >-
        Crate lifecycle. `piled` = visible in the bin. `reworked` =
        re-dispatched through the NORMAL confirm flow (never a silent
        auto-retry). `dismissed` = the REQUIRED dismiss verb — without it
        the bin is nagware (KICKOFF-v3.1 failure-loop rule).
      type: string
      enum: [piled, reworked, dismissed]

    ReworkBinItem:
      description: >-
        One failure crate (v3 failure loop — Scrap & Rework Bin). Every
        crate is backed by a real failed/killed dispatch or terminal
        crisis; the bin never invents work.
      type: object
      additionalProperties: false
      required: [id, source, failureRef, status, createdAt]
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/ReworkBinSourceValue'
        failureRef:
          $ref: '#/components/schemas/ReworkFailureRef'
        status:
          $ref: '#/components/schemas/ReworkBinStatusValue'
        dismissedReason:
          type: string
          description: Optional free-text reason recorded with a dismiss — data, never a guilt prompt.
        createdAt:
          type: integer
        resolvedAt:
          type: integer
          description: Epoch ms the crate left `piled` (reworked or dismissed).

    ReworkBinUpdated:
      description: >-
        A rework-bin crate was piled, reworked, or dismissed — broadcast per
        mutation, piled crates replayed on WebSocket connect.
      type: object
      additionalProperties: false
      required: [type, item]
      properties:
        type:
          const: reworkBinUpdated
        item:
          $ref: '#/components/schemas/ReworkBinItem'

    RelationshipKindValue:
      description: Relationship string kind — rivalry or bond.
      type: string
      enum: [rivalry, bond]

    RelationshipPair:
      description: >-
        One staff relationship derived from REAL worktree/repo overlap
        facts (v3 emergence anchor). `evidence` is required and non-empty —
        each entry is a verbatim overlap fact (e.g. two live agent cwds
        under the same repo/worktree). `activeWarning` doubles as the
        GENUINE worktree-collision early warning (⚠ RIVALRY, shape+label
        first) — it is real ops signal wearing a costume, never flavor.
      type: object
      additionalProperties: false
      required: [staffIds, kind, evidence, activeWarning]
      properties:
        staffIds:
          type: array
          minItems: 2
          maxItems: 2
          description: The two staff ids (employeeId.ts lineage keys), sorted — the pair's stable identity.
          items:
            type: string
        kind:
          $ref: '#/components/schemas/RelationshipKindValue'
        evidence:
          type: array
          minItems: 1
          description: Verbatim worktree/repo overlap facts backing this relationship.
          items:
            type: string
        activeWarning:
          type: boolean
          description: >-
            True while both agents are LIVE in overlapping checkouts — the
            real collision early-warning (incident 74d74e8's lesson made a
            mechanic). Never true from historical overlap alone.

    RivalryUpdated:
      description: >-
        A rivalry/bond pair was derived, re-evidenced, or its collision
        warning toggled — broadcast per mutation, full active set replayed
        on WebSocket connect.
      type: object
      additionalProperties: false
      required: [type, pair]
      properties:
        type:
          const: rivalryUpdated
        pair:
          $ref: '#/components/schemas/RelationshipPair'

