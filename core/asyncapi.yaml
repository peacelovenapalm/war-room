        id:
          type: integer

    DispatchRequest:
      description: >-
        Ask a machine's dispatch runner to start a real headless CLI run
        (action "dispatch"), bring a session's terminal to front (action
        "focus"), or launch a MANAGED interactive session inside a
        runner-owned tmux (action "session" — T2/T4,
        REMOTE-ANSWER-DESIGN.md; prompt optional, the opening brief). The
        server never shells out — this is a queue entry; a per-machine
        runner (opt-in, runbook-installed) polls it over the authed channel
        and decides locally against its own allowlist
        (`~/.war-room/dispatch.json`), which the server cannot override.
        `prompt` travels only as far as the server's queue and the runner's
        authed poll — it is never echoed back over this WebSocket plane
        (see DispatchUpdate.promptPreview).
      type: object
      additionalProperties: false
      required: [type, action, machine]
      properties:
        type:
          const: dispatchRequest
        action:
          $ref: '#/components/schemas/DispatchActionValue'
        machine:
          type: string
          description: Target machine TEXT label (from a live GET /api/dispatch/machines advertisement).
        provider:
          type: string
          description: Coworker provider id ('claude', 'codex', 'gemini') — required for action "dispatch".
        cwd:
          type: string
          description: Project directory the CLI should run in — required for action "dispatch".
        prompt:
          type: string
          maxLength: 4000
          description: Prompt text, passed to the runner as a single argv element — required for action "dispatch".
        sessionId:
          type: string
          description: Session id to bring to front — action "focus" (sessionId or pid required).
        pid:
          type: integer
          description: Process id to bring to front — action "focus" (sessionId or pid required).
        scriptId:
          type: string
          pattern: '^[a-zA-Z0-9._-]{1,64}$'
          description: >-
            T8 Mini compute — opaque id of a registered compute script,
            required for provider "shell" (a NON-LLM dispatch). The runner
            resolves it to an interpreter/path against its own machine-local
            registry; the wire never carries the path. Ignored for LLM
            providers.
        args:
          type: array
          items:
            type: string
          maxItems: 16
          description: >-
            T8 Mini compute — plain-token positional args for a "shell"
            dispatch. Each is a single argv element (spawned shell:false);
            the runner rejects shell metacharacters/control chars and caps
            the count per-script. Ignored for LLM providers.
        model:
          type: string
          pattern: '^[a-zA-Z0-9._/-]{1,64}$'
          description: >-
            Optional model id/alias for the provider CLI (e.g. 'fable',
            'claude-fable-5', 'o3') — action "dispatch" only. The runner
            threads it to argv only for providers with a real --model flag.
        effort:
          $ref: '#/components/schemas/DispatchEffortValue'
        permissionMode:
          $ref: '#/components/schemas/DispatchPermissionModeValue'
        timeoutSec:
          type: integer
          minimum: 1
          maximum: 3600
          description: >-
            Optional per-run wall-clock cap in seconds — action "dispatch"
            only. The runner arms a timer on spawn; at the cap it SIGTERMs
            the child through its own live-children registry (same
            containment as the worker session kill mechanic), escalating to
            SIGKILL after a short grace period if the child ignores TERM.
            Absent means no cap — current (unbounded) behavior.
        requestId:
          type: string
          maxLength: 64
          description: >-
            Client-generated correlation id, echoed verbatim on every
            dispatchUpdate for the queue entry this request created. The
            wire has no send ack, so exact per-request correlation is the
            only way a client can tell WHICH of its sends a broadcast
            answers (two rapid sends to the same machine+action are
            otherwise indistinguishable to the send-failure detector).
        launchedVia:
          $ref: '#/components/schemas/LaunchedViaValue'

    LaunchedViaValue:
      description: >-
        C3 born-managed wrapper — which entry point issued an action
        "session" DispatchRequest: the CALL modal ("call-modal") or the
        `wr claude` terminal wrapper ("wrapper"). Additive, optional, and
        meaningful only for action "session" (dispatch/focus omit it).
        Recorded server-side on the queue entry the request created and
        surfaced read-only in the drawer once the session goes managed —
        the runner's own manifest/tmux plumbing never carries or needs
        this distinction (mechanism (d): the wrapper is a WS client
        structurally identical to the CALL modal, never a runner-side
        code path), so it is derived entirely from which client sent the
        request, not from anything the runner reports.
      type: string
      enum: [wrapper, call-modal]

    DispatchEffortValue:
      description: >-
        Optional reasoning-effort level for a dispatch request. Only some
        providers have an --effort-equivalent flag (currently claude); the
        runner silently omits it for the rest.
      type: string
      enum: [low, medium, high, xhigh, max]

    DispatchPermissionModeValue:
      description: >-
        4B permission-mode toggle for an LLM dispatch/session. CLOSED enum,
        validated server-side AND member-checked again by the runner before
        it ever maps to a CLI flag (free text here would be an
        arbitrary-flag injection surface). "default" omits the flag
        entirely; "plan" maps to `--permission-mode plan` for providers
        that have the flag (currently claude — others silently omit, same
        discipline as effort).
      type: string
      enum: [default, plan]

    TailSubscribe:
      description: >-
        Subscribe THIS socket to a (source, id) output stream (KICKOFF-v2.0
        Phase 2). The server immediately replays the ring buffer's retained
        chunks to this socket only, then forwards new chunks live. Purely a
        telemetry-routing request — it never starts, stops, or steers the
        underlying run.
      type: object
      additionalProperties: false
      required: [type, source, id]
      properties:
        type:
          const: tailSubscribe
        source:
          $ref: '#/components/schemas/OutputSourceValue'
        id:
          type: string

    TailUnsubscribe:
      description: >-
        Stop forwarding a (source, id) output stream to this socket. Socket
        close implicitly unsubscribes everything.
      type: object
      additionalProperties: false
      required: [type, source, id]
      properties:
        type:
          const: tailUnsubscribe
        source:
          $ref: '#/components/schemas/OutputSourceValue'
        id:
          type: string

