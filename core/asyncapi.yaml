# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        - $ref: '#/components/schemas/AgentPollState'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        - $ref: '#/components/schemas/AgentTokenUsage'
        - $ref: '#/components/schemas/AgentPidUpdate'
        # Progression (v1 mechanic #3)
        - $ref: '#/components/schemas/ProgressionUpdate'
        # Dispatch (v1 mechanic #6b — call a coworker)
        - $ref: '#/components/schemas/DispatchUpdate'
        # Employees (v2 mechanic G1 — colony-sim layer, GAME-DESIGN.md §4)
        - $ref: '#/components/schemas/EmployeeSnapshot'
        - $ref: '#/components/schemas/EmployeeHired'
        - $ref: '#/components/schemas/EmployeeQuit'
        # Economy + Building (v2 mechanic G2 — GAME-DESIGN.md §3/§5)
        - $ref: '#/components/schemas/EconomyUpdate'
        - $ref: '#/components/schemas/OfficeExpanded'
        - $ref: '#/components/schemas/OfficeLayoutUpdated'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/DispatchRequest'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/RequestDiagnostics'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        machine:
          type: string
          description: TEXT label of the machine this agent runs on (e.g. "MACBOOK", "NEXUS").
        provider:
          type: string
          description: >-
            Coworker provider id ('codex', 'gemini', …) when the agent is NOT a
            Claude Code session. Rendered as a distinct silhouette + TEXT label
            (e.g. "[CODEX]") — never color-only. Absent for Claude sessions.
        sessionId:
          type: string
          description: >-
            The real session/transcript id (server AgentState.sessionId).
            Carried through so the detail drawer (mechanic #6b) can target a
            FOCUS dispatch and show a copy-able identity line; never rendered
            as a chip/badge on its own.
        cwd:
          type: string
          description: >-
            Real project directory (server AgentState.projectDir) — the
            detail drawer's "project dir" field. Distinct from folderName,
            which is only the short label used for multi-root workspaces.
        pid:
          type: integer
          description: >-
            OS process id of the claude session, captured via the command-hook
            forwarder's X-Pid header (server AgentState.pid). Drives the
            detail drawer's FOCUS button (bin/dispatch-runner.mjs `focus`
            action fronts a terminal by pid). Absent until the first hook
            event with pid telemetry arrives for this session — FOCUS stays
            honestly disabled ("NO PID") until then.

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean
        machines:
          type: object
          description: Map of agent ID (string) to machine TEXT label (e.g. "MACBOOK", "NEXUS").
          additionalProperties:
            type: string
        providers:
          type: object
          description: >-
            Map of agent ID (string) to coworker provider id ('codex',
            'gemini', …). Claude sessions are omitted (house default).
          additionalProperties:
            type: string
        sessionIds:
          type: object
          description: Map of agent ID (string) to real session/transcript id.
          additionalProperties:
            type: string
        cwds:
          type: object
          description: Map of agent ID (string) to real project directory.
          additionalProperties:
            type: string
        pids:
          type: object
          description: Map of agent ID (string) to OS process id (see AgentCreated.pid).
          additionalProperties:
            type: integer

    AgentPidUpdate:
      description: >-
        Late-arriving pid telemetry for an already-known agent (e.g. a
        locally-discovered session whose hook events start including X-Pid
        only after the forwarder is installed/refreshed). AgentCreated/
        ExistingAgents cover the pid-at-creation case; this covers pid
        arriving afterward so the FOCUS button lights up live without a
        page refresh.
      type: object
      additionalProperties: false
      required: [type, id, pid]
      properties:
        type:
          const: agentPidUpdate
        id:
          type: integer
        pid:
          type: integer

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    AgentPollState:
      description: >-
        Session state reported by the per-machine needs-input poller
        (`claude agents --json`, research preview surface). Absent `state`
        means the poll state was cleared (client falls back to local
        JSONL/hook signals). `blocked` renders as the loudest ⚠ NEEDS INPUT
        badge — SHAPE + TEXT label, color as reinforcement only (colorblind
        rule).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentPollState
        id:
          type: integer
        state:
          $ref: '#/components/schemas/AgentPollStateValue'
        waitingFor:
          type: string
          description: >-
            What the blocked agent is waiting on (verbatim from the CLI).
            Rendered as TEXT detail under the NEEDS INPUT badge.
        ageMs:
          type: integer
          description: >-
            Milliseconds since the state TRANSITION, computed on the server's
            clock so client clock skew cancels out (client derives
            `since = Date.now() - ageMs`). Drives the v1 crisis layer's
            smoke → fire → alarm aging. Absent on clear messages.
        stale:
          type: boolean
          description: >-
            Set on CLEAR messages caused by poller silence (TTL sweep) rather
            than an observed state change — the session may still be blocked.
            The webview drops the badge without the "resolved" celebration.

    AgentPollStateValue:
      description: Agent session state from `claude agents --json`.
      type: string
      enum: [working, blocked, done, failed, stopped]

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentTokenUsage:
      description: Cumulative token usage for the agent's session.
      type: object
      additionalProperties: false
      required: [type, id, inputTokens, outputTokens]
      properties:
        type:
          const: agentTokenUsage
        id:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer

    ProgressionUpdate:
      description: >-
        Progression snapshot (v1 mechanic #3): server-side XP/level/streak/
        unlock state, one per user (not per agent). Broadcast whenever it
        changes and sent again to every client on WebSocket connect. XP comes
        ONLY from real, observed events — completed turns, observed crisis
        resolutions (never stale/TTL poller clears), and shift-report grades
        — never from token volume (hard guardrail: no dark patterns on real
        money; nothing here ever rewards spending more).
      type: object
      additionalProperties: false
      required:
        [type, xp, level, xpIntoLevel, xpForNextLevel, streakCurrent, streakLongest, unlocks]
      properties:
        type:
          const: progressionUpdate
        xp:
          type: integer
        level:
          type: integer
        xpIntoLevel:
          type: integer
          description: XP earned since reaching the current level.
        xpForNextLevel:
          type: integer
          description: Total XP required to go from the current level to the next.
        streakCurrent:
          type: integer
          description: >-
            Consecutive local-calendar days with at least one observed real
            completed turn — the M5 soak made literal.
        streakLongest:
          type: integer
        unlocks:
          type: object
          description: >-
            DATA ONLY for now — permanent achievement flags (never revert
            once true). Mechanic #5 (expression pass) will consume these to
            render decor in a later wave; nothing renders from them yet.
          additionalProperties:
            type: boolean

    DispatchUpdate:
      description: >-
        Dispatch queue lifecycle (v1 mechanic #6b — "call a coworker"):
        broadcast whenever a dispatch or focus request changes state, and
        replayed for non-terminal entries to every client on WebSocket
        connect. Lifecycle: ringing -> answered -> exited, or ringing ->
        denied / expired. `promptPreview` is a ~120-char truncation only —
        the full prompt NEVER travels over this broadcast plane (it is
        carried solely on the Bearer-authed runner poll). Rendered as a
        distinct glyph + WORD per status (colorblind rule): (ringing) ->
        (answered) / (denied) / (expired) / (exited).
      type: object
      additionalProperties: false
      required: [type, id, action, status, machine]
      properties:
        type:
          const: dispatchUpdate
        id:
          type: string
          description: Dispatch request UUID.
        action:
          $ref: '#/components/schemas/DispatchActionValue'
        status:
          $ref: '#/components/schemas/DispatchStatusValue'
        machine:
          type: string
          description: Target machine TEXT label the request was dispatched to.
        provider:
          type: string
          description: Coworker provider id ('claude', 'codex', 'gemini') — dispatch action only.
        promptPreview:
          type: string
          description: >-
            Truncated (~120 char) preview of the prompt — dispatch action
            only. The full prompt is never broadcast.
        reason:
          type: string
          description: Deny/failure reason (data, not an error) — e.g. "path-not-allowlisted".
        pid:
          type: integer
          description: Process id of the spawned CLI (dispatch) or focused session (focus), once known.
        exitCode:
          type: integer
          description: Exit code of the spawned process — exited status only.
        resultTail:
          type: string
          description: >-
            Capped (~8KB) tail of the run's log — dispatch action, exited
            status only. The only place a run's actual output reaches the
            dashboard; same trust level as promptPreview (never the full log).

    DispatchActionValue:
      description: Dispatch queue entry kind.
      type: string
      enum: [dispatch, focus]

    DispatchStatusValue:
      description: >-
        Dispatch queue lifecycle status. `ringing` = queued, awaiting a
        runner's decision. `answered` = a runner accepted (dispatch: CLI
        run in progress; focus: terminal fronted). `denied` = a runner
        (or the server, for an unknown/expired id) refused — a decision,
        never an HTTP error. `expired` = no runner answered within the
        TTL. `exited` = the spawned dispatch process ended (dispatch only).
      type: string
      enum: [ringing, answered, denied, expired, exited]

    EmployeeScores:
      description: >-
        Derived traits (GAME-DESIGN §4.3), 0-100 + trainingBonus on top —
        never player-assigned. Stay at neutral defaults below MIN_SAMPLES.
      type: object
      additionalProperties: false
      required: [speed, accuracy, nightOwl, tokenEfficiency]
      properties:
        speed:
          type: number
        accuracy:
          type: number
        nightOwl:
          type: number
        tokenEfficiency:
          type: number
          description: Lower OUTPUT token spend scores HIGHER — never a reward for volume.

    EmployeeTrainingBonus:
      type: object
      additionalProperties: false
      required: [speed, accuracy, nightOwl, tokenEfficiency]
      properties:
        speed:
          type: number
        accuracy:
          type: number
        nightOwl:
          type: number
        tokenEfficiency:
          type: number

    EmployeeProviderValue:
      type: string
      enum: [claude, codex]

    EmployeeStatusValue:
      type: string
      enum: [candidate, active, on_break, training, quit, fired, retired]

    EmployeeRankValue:
      type: string
      enum: [Junior, Senior, Lead, Principal]

    EmployeeSnapshot:
      description: >-
        Full employee record snapshot (v2 mechanic G1, GAME-DESIGN §4),
        broadcast after every mutation (turn recorded, crisis resolved,
        verb applied) and replayed for the whole roster on WebSocket
        connect. Mood-only — the three per-employee needs meters are CUT
        (interrogation delta #2). Internal-only bookkeeping fields
        (last-seen token counts, decay timestamps) never leave the server.
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - machine
        - projectDir
        - projectLabel
        - name
        - spriteIndex
        - defaultProvider
        - status
        - rank
        - xp
        - mood
        - moodBoost
        - scores
        - trainingBonus
        - sampleCount
        - createdAt
        - lastActiveAt
        - lowMoodStreakDays
      properties:
        type:
          const: employeeSnapshot
        id:
          type: string
        machine:
          type: string
        projectDir:
          type: string
        projectLabel:
          type: string
        name:
          type: string
        spriteIndex:
          type: integer
          description: >-
            Raw deterministic hash of id — the webview mods by the real
            getLoadedCharacterCount(), never a server-side mod.
        defaultProvider:
          $ref: '#/components/schemas/EmployeeProviderValue'
        defaultModel:
          type: string
        status:
          $ref: '#/components/schemas/EmployeeStatusValue'
        rank:
          $ref: '#/components/schemas/EmployeeRankValue'
        xp:
          type: integer
        mood:
          type: number
          description: Stored base value (needs cut) — effective mood on read is mood+moodBoost.
        moodBoost:
          type: number
          description: Transient event term, clamped ±20, halves each local day.
        scores:
          $ref: '#/components/schemas/EmployeeScores'
        trainingBonus:
          $ref: '#/components/schemas/EmployeeTrainingBonus'
        sampleCount:
          type: integer
          description: >-
            rolling.recentTurns.length — the MIN_SAMPLES=5 gate clients need
            to know whether `scores` is a real read or still neutral
            defaults (ROOKIE badge). The raw turn ring buffer itself never
            leaves the server.
        assignedRoomId:
          type: string
        createdAt:
          type: integer
        lastActiveAt:
          type: integer
        lowMoodStreakDays:
          type: integer
        breakUntil:
          type: integer

    EmployeeHired:
      description: >-
        A brand-new employee identity was observed for the first time
        (first real telemetry for a (machine, project) pair, or a fresh
        `#n` record allocated after a fire) — the roster-arrival signal,
        distinct from EmployeeSnapshot's routine per-mutation broadcast.
      type: object
      additionalProperties: false
      required: [type, id, name, spriteIndex]
      properties:
        type:
          const: employeeHired
        id:
          type: string
        name:
          type: string
        spriteIndex:
          type: integer

    EmployeeQuit:
      description: >-
        An employee's status transitioned to 'quit' (mood-driven, not
        fired — GAME-DESIGN §4.5). Distinct from the routine
        EmployeeSnapshot broadcast so the webview/Bark digest (G4) can key
        a specific quit celebration/notification off it without diffing
        status transitions client-side.
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type:
          const: employeeQuit
        id:
          type: string
        name:
          type: string

    EconomyCurrencyValue:
      type: string
      enum: [cash, reputation]

    EconomyLedgerEntry:
      description: One Cash/Reputation ledger line (capped ring buffer, 200 entries).
      type: object
      additionalProperties: false
      required: [ts, delta, currency, reason]
      properties:
        ts:
          type: integer
        delta:
          type: number
        currency:
          $ref: '#/components/schemas/EconomyCurrencyValue'
        reason:
          type: string
          description: >-
            The anti-dark-pattern grep-test surface — every award traces to
            an observed real event, never a bare timer or token volume.

    EconomyUpdate:
      description: >-
        Economy snapshot (v2 mechanic G2, GAME-DESIGN §3): dual currency —
        Cash (liquid, spendable) and Reputation (permanent, slow, never
        spent) — plus office-wide grime and the studio vacation-mode flag.
        Broadcast whenever it changes and sent again to every client on
        WebSocket connect (after the offline-progress Reputation-decay
        catch-up runs). Cash/Reputation come ONLY from real, observed
        events — never token volume.
      type: object
      additionalProperties: false
      required: [type, cash, reputation, grime, vacationMode, bayCount, ledger]
      properties:
        type:
          const: economyUpdate
        cash:
          type: integer
        reputation:
          type: integer
        grime:
          type: number
          description: Office-wide 0-100, cosmetic + morale-decay-rate multiplier when >70.
        vacationMode:
          type: boolean
        bayCount:
          type: integer
          description: Office-expansion bays purchased so far (GAME-DESIGN §5.2).
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/EconomyLedgerEntry'

    OfficeExpanded:
      description: >-
        A bay (4-col floor expansion, GAME-DESIGN §5.2) was purchased —
        broadcast by POST /api/building/expand on success. Carries the new
        full layout so every connected screen picks up the extra floor
        (and its doorway) without a re-fetch.
      type: object
      additionalProperties: false
      required: [type, layout, bayCount]
      properties:
        type:
          const: officeExpanded
        layout:
          type: object
          description: Opaque OfficeLayout object — format defined by webview-ui, same as LayoutLoaded.
        bayCount:
          type: integer

    OfficeLayoutUpdated:
      description: >-
        The office layout changed via a room tag, buffed-furniture
        purchase, or sell action (GAME-DESIGN §5.7) — broadcast by
        POST /api/building/{room,furniture,sell} on success. Carries the
        new full layout, same shape as OfficeExpanded/LayoutLoaded.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: officeLayoutUpdated
        layout:
          type: object
          description: Opaque OfficeLayout object — format defined by webview-ui, same as LayoutLoaded.

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    DispatchRequest:
      description: >-
        Ask a machine's dispatch runner to either start a real headless CLI
        run (action "dispatch") or bring a session's terminal to front
        (action "focus"). The server never shells out — this is a queue
        entry; a per-machine runner (opt-in, runbook-installed) polls it
        over the authed channel and decides locally against its own
        allowlist (`~/.war-room/dispatch.json`), which the server cannot
        override. `prompt` travels only as far as the server's queue and
        the runner's authed poll — it is never echoed back over this
        WebSocket plane (see DispatchUpdate.promptPreview).
      type: object
      additionalProperties: false
      required: [type, action, machine]
      properties:
        type:
          const: dispatchRequest
        action:
          $ref: '#/components/schemas/DispatchActionValue'
        machine:
          type: string
          description: Target machine TEXT label (from a live GET /api/dispatch/machines advertisement).
        provider:
          type: string
          description: Coworker provider id ('claude', 'codex', 'gemini') — required for action "dispatch".
        cwd:
          type: string
          description: Project directory the CLI should run in — required for action "dispatch".
        prompt:
          type: string
          maxLength: 4000
          description: Prompt text, passed to the runner as a single argv element — required for action "dispatch".
        sessionId:
          type: string
          description: Session id to bring to front — action "focus" (sessionId or pid required).
        pid:
          type: integer
          description: Process id to bring to front — action "focus" (sessionId or pid required).
        model:
          type: string
          pattern: '^[a-zA-Z0-9._/-]{1,64}$'
          description: >-
            Optional model id/alias for the provider CLI (e.g. 'fable',
            'claude-fable-5', 'o3') — action "dispatch" only. The runner
            threads it to argv only for providers with a real --model flag.
        effort:
          $ref: '#/components/schemas/DispatchEffortValue'

    DispatchEffortValue:
      description: >-
        Optional reasoning-effort level for a dispatch request. Only some
        providers have an --effort-equivalent flag (currently claude); the
        runner silently omits it for the rest.
      type: string
      enum: [low, medium, high, xhigh, max]

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setHooksEnabled
        enabled:
          type: boolean

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: Add an external asset directory (host shows a directory picker).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
